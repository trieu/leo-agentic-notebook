name: Gemini Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  gemini:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@gemini')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@gemini')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@gemini')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@gemini') || contains(github.event.issue.title, '@gemini')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Gemini to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Gemini
        id: gemini
        uses: google-github-actions/run-gemini-cli@v0
        with:
          # github_token is used by the Gemini CLI to read/post on issues and PRs.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # API key from Google AI Studio (https://aistudio.google.com/apikey).
          # For Vertex AI / Workload Identity instead, see the action's docs and use
          # gcp_workload_identity_provider / gcp_project_id with use_vertex_ai: true.
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            You were mentioned with @gemini in ${{ github.repository }} (event: ${{ github.event_name }}).
            Read the relevant issue, pull request, and comment context, then carry out the request.
            Reply with a comment, and open a pull request if code changes are needed.
          # Optional: customize the Gemini CLI invocation. See
          # https://github.com/google-github-actions/run-gemini-cli
          # for available inputs (settings, gemini_cli_version, model, etc.).
