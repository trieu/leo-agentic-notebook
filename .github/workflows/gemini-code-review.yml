name: Gemini Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  pull_request_target:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  gemini-review:
    # Run for fork PRs (via pull_request_target) OR same-repo PRs (via pull_request), but not both
    if: |
      (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository) ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Run Gemini Code Review
        id: gemini-review
        uses: google-github-actions/run-gemini-cli@v0
        with:
          # github_token is used by the Gemini CLI to read the PR and post the review.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # API key from Google AI Studio (https://aistudio.google.com/apikey).
          # For Vertex AI / Workload Identity instead, see the action's docs and use
          # gcp_workload_identity_provider / gcp_project_id with use_vertex_ai: true.
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Read the PR diff, then identify bugs, security issues, and code-quality problems.
            Post your findings as a review comment on the PR.
          # See https://github.com/google-github-actions/run-gemini-cli
          # for available inputs (settings, gemini_cli_version, model, etc.).
